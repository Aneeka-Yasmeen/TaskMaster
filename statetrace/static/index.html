<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskMaster</title>
<meta name="description" content="TaskMaster reconstructs the evidence-backed current state of your engineering projects.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  try { const t = localStorage.getItem("tm.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<!--TM_MODE-->
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <a href="#/" class="brand-link" aria-label="TaskMaster home">
        <span class="logo" aria-hidden="true"></span>
        <span class="wordmark">TaskMaster</span>
      </a>
      <button class="icon-btn only-mobile" data-action="close-nav" aria-label="Close navigation"></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="scrim" data-action="close-nav"></div>
  <div class="main-col">
    <header class="topbar" id="topbar">
      <button class="icon-btn only-mobile" data-action="open-nav" aria-label="Open navigation" aria-controls="sidebar"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-scrim" data-action="close-sheet"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
</div>
<div class="drawer-wrap" id="drawer-wrap" hidden>
  <div class="sheet-scrim" data-action="close-drawer"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
